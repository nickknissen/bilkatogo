[project]
name = "bilkatogo"
version = "0.13.1"
description = "Async client and CLI for tracking BilkaToGo orders."
readme = "README.md"
authors = [
    { name = "Nick Nissen", email = "nickknissen@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["bilka", "bilkatogo", "danish", "groceries", "api", "async"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: AsyncIO",
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
cli = ["typer>=0.27.3,<0.28"]

[project.scripts]
bilkatogo = "bilkatogo.__main__:main"

[project.urls]
Homepage = "https://github.com/nickknissen/bilkatogo"
Repository = "https://github.com/nickknissen/bilkatogo"
Issues = "https://github.com/nickknissen/bilkatogo/issues"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]
conflicts = [[{ group = "dev" }, { group = "ha" }]]

# The library supports Python 3.12 and up; Home Assistant, and so its tests, needs 3.14.2.
[tool.uv.dependency-groups]
ha = { requires-python = ">=3.14.2" }

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".worktrees", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "LOG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: reads the real bilkatogo.dk; run with -m live"]
# Home Assistant replaces httpx with httpx2 when imported; respx's plugin would import
# httpx first. Tests use respx.mock directly.
addopts = "-m 'not live' -p no:respx"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src/", "tests/", "release.py", "scripts/"]
exclude = ["tests/ha/"]

[tool.ty.rules]
division-by-zero = "warn"

[[tool.ty.overrides]]
include = ["tests/"]

[tool.ty.overrides.rules]
invalid-assignment = "ignore"

[tool.mypy]
mypy_path = "stubs"

[dependency-groups]
dev = [
    "bilkatogo[cli]",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-freezer>=0.4.9",
    "ruff>=0.17.3",
    "ty>=0.0.92",
]
ha = [
    "mypy>=2.4.0",
    # Pins Home Assistant 2026.11.1. CI's ha-test-oldest job also tests the oldest one
    # hacs.json allows.
    "pytest-homeassistant==2026.11.1",
    "respx>=0.22.0",
    "ty>=0.0.92",
]
