add_to_cart:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: bilkatogo
    article_number:
      required: true
      example: "19753"
      selector:
        text:
    quantity:
      default: 1
      selector:
        number:
          min: 1
          mode: box

add_items_to_cart:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: bilkatogo
    items:
      required: true
      example: '[{"article_number": "18381", "quantity": 10}, {"article_number": "19753"}]'
      selector:
        object:

remove_from_cart:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: bilkatogo
    article_number:
      required: true
      example: "19753"
      selector:
        text:
    quantity:
      selector:
        number:
          min: 1
          mode: box

search:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: bilkatogo
    query:
      required: true
      example: "skyr"
      selector:
        text:
    limit:
      default: 10
      selector:
        number:
          min: 1
          mode: box
    in_stock:
      default: false
      selector:
        boolean:
    on_offer:
      default: false
      selector:
        boolean:
    in_leaflet:
      default: false
      selector:
        boolean:
    sort:
      default: relevance
      selector:
        select:
          translation_key: search_sort
          options:
            - relevance
            - price
            - unit_price

get_cart:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: bilkatogo

choose_pickup_slot:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: bilkatogo
    date:
      required: true
      example: "2026-11-12"
      selector:
        date:
    start:
      required: true
      example: "16:00"
      selector:
        time:
    end:
      example: "18:00"
      selector:
        time:

choose_pickup_point:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: bilkatogo
    pickup_point:
      required: true
      example: "Bilka Odense"
      selector:
        text:

choose_home_delivery:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: bilkatogo
