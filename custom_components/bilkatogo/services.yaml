add_to_cart:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: bilkatogo
    article_number:
      required: true
      example: "19753"
      selector:
        text:
    quantity:
      default: 1
      selector:
        number:
          min: 1
          mode: box

remove_from_cart:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: bilkatogo
    article_number:
      required: true
      example: "19753"
      selector:
        text:
    quantity:
      selector:
        number:
          min: 1
          mode: box

search:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: bilkatogo
    query:
      required: true
      example: "skyr"
      selector:
        text:
    limit:
      default: 10
      selector:
        number:
          min: 1
          mode: box

get_cart:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: bilkatogo
