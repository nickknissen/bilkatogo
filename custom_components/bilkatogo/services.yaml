add_to_cart:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: bilkatogo
    article_number:
      required: true
      example: "19753"
      selector:
        text:
    quantity:
      default: 1
      selector:
        number:
          min: 1
          mode: box

remove_from_cart:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: bilkatogo
    article_number:
      required: true
      example: "19753"
      selector:
        text:
    quantity:
      selector:
        number:
          min: 1
          mode: box

search:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: bilkatogo
    query:
      required: true
      example: "skyr"
      selector:
        text:
    limit:
      default: 10
      selector:
        number:
          min: 1
          mode: box
    in_stock:
      default: false
      selector:
        boolean:
    on_offer:
      default: false
      selector:
        boolean:
    in_leaflet:
      default: false
      selector:
        boolean:
    sort:
      default: relevance
      selector:
        select:
          translation_key: search_sort
          options:
            - relevance
            - price
            - unit_price

get_cart:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: bilkatogo
